name: security

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
